<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img"
     font-family="'Helvetica Neue',Helvetica,Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>投递语义与幂等</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="360" fill="#ffffff"/>
  <text x="20" y="34" font-size="16" font-weight="700" fill="#0f172a">投递语义与幂等</text>

  <!-- 节点 -->
  <rect x="40" y="120" width="190" height="76" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="135" y="152" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">Producer</text>
  <text x="135" y="170" font-size="10.5" fill="#64748b" text-anchor="middle">acks=all + 幂等</text>

  <rect x="300" y="120" width="170" height="76" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="385" y="152" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">Kafka</text>
  <text x="385" y="170" font-size="10.5" fill="#64748b" text-anchor="middle">3 分区</text>

  <rect x="540" y="130" width="220" height="100" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="650" y="176" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">ClickStatsConsumer</text>
  <text x="650" y="194" font-size="10.5" fill="#64748b" text-anchor="middle">批量聚合 + 位点同事务</text>

  <rect x="850" y="80" width="310" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1005" y="112" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">MySQL</text>
  <text x="1005" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">t_link_stats_daily</text>

  <rect x="850" y="220" width="310" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1005" y="252" font-size="12.5" font-weight="600" fill="#1e293b" text-anchor="middle">MySQL</text>
  <text x="1005" y="270" font-size="10.5" fill="#64748b" text-anchor="middle">t_consumer_offset</text>

  <!-- 主链路 -->
  <line x1="230" y1="158" x2="292" y2="158" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="261" y="148" font-size="11" fill="#334155" text-anchor="middle">至少一次</text>

  <line x1="470" y1="158" x2="532" y2="158" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="501" y="148" font-size="11" fill="#334155" text-anchor="middle">批量投递</text>

  <line x1="760" y1="150" x2="842" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="801" y="124" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">同一事务</text>
  <text x="801" y="138" font-size="10.5" fill="#64748b" text-anchor="middle">UPSERT 累加</text>

  <line x1="760" y1="225" x2="842" y2="225" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="801" y="199" font-size="11" font-weight="600" fill="#1d4ed8" text-anchor="middle">同一事务</text>
  <text x="801" y="213" font-size="10.5" fill="#64748b" text-anchor="middle">推进位点</text>

  <!-- 反馈：事务提交后再提交 Kafka 位点 -->
  <path d="M 650 130 L 650 90 L 385 90 L 385 114" fill="none" stroke="#94a3b8"
        stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrd)"/>
  <text x="517" y="82" font-size="10.5" fill="#64748b" text-anchor="middle">事务提交后再提交 Kafka 位点（仅监控）</text>

  <!-- 反馈：分区分配时 seek -->
  <path d="M 1005 300 L 1005 336 L 650 336 L 650 236" fill="none" stroke="#94a3b8"
        stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrd)"/>
  <text x="827" y="328" font-size="10.5" fill="#64748b" text-anchor="middle">分区分配时 seek</text>
</svg>
