<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分布式短链平台</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --line: #e6e9f0;
    --text: #1f2937;
    --muted: #7b8496;
    --brand: #3b6ef6;
    --brand-dark: #2c55c9;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  header h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.3px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: #e8eeff; color: var(--brand-dark); border: 1px solid #d3ddff;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card .hint { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  label .opt { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=url], input[type=datetime-local] {
    width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text);
    background: #fbfcfe; border: 1px solid var(--line); border-radius: 8px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(59, 110, 246, .12); background: #fff; }
  .field { margin-bottom: 14px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    padding: 10px 18px; font-size: 14px; font-weight: 600; color: #fff;
    background: var(--brand); border: none; border-radius: 8px; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--brand-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost {
    background: #fff; color: var(--text); border: 1px solid var(--line);
    padding: 9px 14px; font-weight: 500;
  }
  button.ghost:hover:not(:disabled) { background: #f7f8fc; }

  .result { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .result[hidden] { display: none; }
  .shortlink {
    display: flex; gap: 8px; align-items: center;
    background: #f2f6ff; border: 1px solid #d9e3ff; border-radius: 8px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .shortlink a {
    flex: 1; min-width: 0; color: var(--brand-dark); font-weight: 600;
    text-decoration: none; font-size: 14px; overflow-wrap: anywhere;
  }
  .shortlink a:hover { text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .meta code, .hint code { background: #f1f3f8; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .metric { background: #fbfcfe; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .metric .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .metric .v { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .metric .v.accent { color: var(--brand); }

  .chart-title { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 140px; }
  .bar-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
  .bar {
    width: 100%; min-height: 3px; border-radius: 5px 5px 2px 2px;
    background: linear-gradient(180deg, #6d94ff, #3b6ef6);
    transition: height .35s cubic-bezier(.4, 0, .2, 1);
  }
  .bar.empty { background: #e9ecf3; }
  .bar-num { font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .bar-num.has { color: var(--brand-dark); }
  .bar-date { font-size: 11px; color: var(--muted); white-space: nowrap; }

  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #eafaf0; border: 1px solid #bfe9cf; color: #15703c; }
  .msg.err { background: #fdecec; border: 1px solid #f6c9c9; color: #b91c1c; }
  .msg.warn { background: #fff7e8; border: 1px solid #f6e0b8; color: #a35c07; }

  footer { margin-top: 26px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>分布式短链平台</h1>
    <p>雪花 ID + Base62 发号 · Redis 缓存跳转 · Kafka 异步点击统计 · Redis+Lua 限流</p>
    <div class="stack">
      <span class="tag">Spring Boot 3.4</span>
      <span class="tag">MySQL</span>
      <span class="tag">Redis</span>
      <span class="tag">Kafka</span>
    </div>
  </header>

  <div class="grid">
    <!-- 创建短链 -->
    <section class="card">
      <h2>创建短链</h2>
      <p class="hint">按 IP 限流 5 次/分钟。长链接必须以 <code>http://</code> 或 <code>https://</code> 开头。</p>

      <div class="field">
        <label for="longUrl">长链接</label>
        <input id="longUrl" type="url" placeholder="https://www.example.com/very/long/path?query=1" autocomplete="off">
      </div>
      <div class="field">
        <label for="expireAt">过期时间 <span class="opt">（可选，留空表示永久有效）</span></label>
        <input id="expireAt" type="datetime-local">
      </div>

      <div class="row">
        <button id="btnCreate">生成短链</button>
        <button class="ghost" id="btnSample" type="button">填入示例</button>
      </div>

      <div class="result" id="createResult" hidden>
        <div class="shortlink">
          <a id="shortUrl" href="#" target="_blank" rel="noopener"></a>
          <button class="ghost" id="btnCopy" type="button">复制</button>
        </div>
        <div class="meta">
          短码 <code id="codeText"></code><br>
          原始链接 <span id="longUrlText"></span><br>
          <span id="expireText"></span>
        </div>
      </div>

      <div class="msg" id="createMsg"></div>
    </section>

    <!-- 查询统计 -->
    <section class="card">
      <h2>点击统计</h2>
      <p class="hint">
        实时总量/UV 来自 Redis，近 7 天明细由 Kafka 异步消费后落库 MySQL，通常延迟数秒。
      </p>

      <div class="field">
        <label for="statsCode">短码</label>
        <input id="statsCode" type="text" placeholder="例如 mTyOaKbUcr" autocomplete="off">
      </div>

      <div class="row">
        <button id="btnStats">查询统计</button>
        <button class="ghost" id="btnStatsSample" type="button">填入示例</button>
      </div>

      <div class="msg" id="statsMsg"></div>

      <div id="statsResult" hidden style="margin-top:18px">
        <div class="metrics">
          <div class="metric"><div class="k">总点击</div><div class="v accent" id="mTotal">0</div></div>
          <div class="metric"><div class="k">今日点击</div><div class="v" id="mToday">0</div></div>
          <div class="metric"><div class="k">UV</div><div class="v" id="mUv">0</div></div>
        </div>
        <p class="chart-title">近 7 天点击</p>
        <div class="chart" id="chart"></div>
      </div>
    </section>
  </div>

  <footer>短链跳转使用 302（而非 301），避免浏览器永久缓存导致统计丢失</footer>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var SAMPLE_URL = 'https://www.example.com/some/very/long/path?query=1&from=shortlink-demo';

  /* ---------- 消息提示 ---------- */
  function showMsg(el, type, text) {
    el.className = 'msg show ' + type;
    el.textContent = text;
  }
  function hideMsg(el) { el.className = 'msg'; el.textContent = ''; }

  /* 把后端错误码翻译成人话：默认错误体不含 message，故按状态码映射 */
  function describe(status, scope) {
    if (status === 400) return '请求参数不合法：长链接需以 http:// 或 https:// 开头，且过期时间不能早于当前时间。';
    if (status === 404) return '短链不存在，请检查短码是否输入正确。';
    if (status === 410) return '该短链已过期。';
    if (status === 429) return scope === 'create'
      ? '创建过于频繁，已达限流上限（5 次/分钟），请稍后再试。'
      : '查询过于频繁，请稍后再试。';
    if (status >= 500) return '服务端异常（HTTP ' + status + '），请查看应用日志。';
    return '请求失败（HTTP ' + status + '）。';
  }

  async function readBody(res) {
    try { return await res.json(); } catch (e) { return null; }
  }

  function setBusy(btn, busy, busyText) {
    if (busy) {
      btn.dataset.text = btn.textContent;
      btn.textContent = busyText;
      btn.disabled = true;
    } else {
      btn.textContent = btn.dataset.text || btn.textContent;
      btn.disabled = false;
    }
  }

  /* ---------- 创建短链 ---------- */
  async function createLink() {
    var btn = $('btnCreate');
    var msg = $('createMsg');
    var longUrl = $('longUrl').value.trim();
    var expireAt = $('expireAt').value;

    hideMsg(msg);
    if (!longUrl) {
      showMsg(msg, 'warn', '请先填写长链接。');
      $('longUrl').focus();
      return;
    }

    var payload = { longUrl: longUrl };
    // datetime-local 为 "YYYY-MM-DDTHH:mm"，LocalDateTime 需要秒
    if (expireAt) payload.expireAt = expireAt.length === 16 ? expireAt + ':00' : expireAt;

    setBusy(btn, true, '生成中…');
    try {
      var res = await fetch('/api/v1/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        showMsg(msg, 'err', describe(res.status, 'create'));
        return;
      }
      var data = await readBody(res);
      if (!data || !data.code) {
        showMsg(msg, 'err', '服务返回数据异常。');
        return;
      }
      renderCreated(data);
      showMsg(msg, 'ok', '创建成功，点击上方短链即可跳转（每次跳转都会计入统计）。');

      // 联动：把短码带进统计查询框并自动查一次
      $('statsCode').value = data.code;
      loadStats();
    } catch (e) {
      showMsg(msg, 'err', '无法连接服务：' + e.message);
    } finally {
      setBusy(btn, false);
    }
  }

  function renderCreated(data) {
    // 用当前访问源拼接，避免后端 base-url 与实际访问地址不一致
    var url = location.origin + '/' + data.code;
    try { sessionStorage.setItem('shortlink.lastCode', data.code); } catch (e) { /* 隐私模式忽略 */ }
    var a = $('shortUrl');
    a.href = url;
    a.textContent = url;
    $('codeText').textContent = data.code;
    $('longUrlText').textContent = data.longUrl;
    $('expireText').textContent = data.expireAt
      ? '过期时间 ' + String(data.expireAt).replace('T', ' ')
      : '永久有效';
    $('createResult').hidden = false;
  }

  /* ---------- 查询统计 ---------- */
  async function loadStats() {
    var btn = $('btnStats');
    var msg = $('statsMsg');
    var code = $('statsCode').value.trim();

    hideMsg(msg);
    if (!code) {
      showMsg(msg, 'warn', '请先填写短码。');
      $('statsCode').focus();
      return;
    }

    setBusy(btn, true, '查询中…');
    try {
      var res = await fetch('/api/v1/stats/' + encodeURIComponent(code));
      if (!res.ok) {
        $('statsResult').hidden = true;
        showMsg(msg, 'err', describe(res.status, 'stats'));
        return;
      }
      var data = await readBody(res);
      if (!data) {
        showMsg(msg, 'err', '服务返回数据异常。');
        return;
      }
      renderStats(data);
    } catch (e) {
      showMsg(msg, 'err', '无法连接服务：' + e.message);
    } finally {
      setBusy(btn, false);
    }
  }

  function renderStats(data) {
    $('mTotal').textContent = data.totalClicks;
    $('mToday').textContent = data.todayClicks;
    $('mUv').textContent = data.uv;
    $('statsResult').hidden = false;
    renderChart(data.daily || []);
  }

  function ymd(d) {
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function renderChart(daily) {
    var map = {};
    daily.forEach(function (d) { map[d.date] = d.clicks; });

    // 后端只返回有记录的日期，这里补齐最近 7 天
    var days = [];
    var today = new Date();
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      var key = ymd(d);
      days.push({ date: key, label: key.slice(5), clicks: map[key] || 0 });
    }

    var max = days.reduce(function (m, d) { return Math.max(m, d.clicks); }, 0);
    var chart = $('chart');
    chart.innerHTML = '';

    days.forEach(function (d) {
      var h = max === 0 ? 0 : Math.round(d.clicks / max * 100);

      var col = document.createElement('div');
      col.className = 'bar-col';

      var num = document.createElement('div');
      num.className = 'bar-num' + (d.clicks > 0 ? ' has' : '');
      num.textContent = d.clicks;
      num.title = d.date + '：' + d.clicks + ' 次';

      var bar = document.createElement('div');
      bar.className = 'bar' + (d.clicks === 0 ? ' empty' : '');
      bar.style.height = (max === 0 ? 3 : Math.max(h, 3)) + '%';

      var date = document.createElement('div');
      date.className = 'bar-date';
      date.textContent = d.label;

      col.appendChild(num);
      col.appendChild(bar);
      col.appendChild(date);
      chart.appendChild(col);
    });
  }

  /* ---------- 复制短链 ---------- */
  async function copyShortUrl() {
    var text = $('shortUrl').textContent;
    var msg = $('createMsg');
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      showMsg(msg, 'ok', '已复制到剪贴板：' + text);
    } catch (e) {
      showMsg(msg, 'warn', '复制失败，请手动选中链接复制。');
    }
  }

  function lastCode() {
    if ($('codeText').textContent) return $('codeText').textContent;
    try { return sessionStorage.getItem('shortlink.lastCode') || ''; } catch (e) { return ''; }
  }

  /* ---------- 事件绑定 ---------- */
  $('btnCreate').addEventListener('click', createLink);
  $('btnStats').addEventListener('click', loadStats);
  $('btnCopy').addEventListener('click', copyShortUrl);
  $('btnSample').addEventListener('click', function () {
    $('longUrl').value = SAMPLE_URL;
    $('longUrl').focus();
  });
  $('btnStatsSample').addEventListener('click', function () {
    var code = lastCode();
    if (!code) {
      showMsg($('statsMsg'), 'warn', '还没有生成过短链，请先在左侧创建一个。');
      $('longUrl').focus();
      return;
    }
    $('statsCode').value = code;
    $('statsCode').focus();
  });
  $('longUrl').addEventListener('keydown', function (e) { if (e.key === 'Enter') createLink(); });
  $('statsCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadStats(); });

  // 刷新后自动回填上次生成的短码
  $('statsCode').value = lastCode();

  renderChart([]);
})();
</script>
</body>
</html>
