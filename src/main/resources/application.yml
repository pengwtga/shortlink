server:
  port: 8080
  tomcat:
    # 注册 Tomcat 的 MBean，让线程池 / 连接数指标（tomcat_threads_*、tomcat_connections_*）
    # 能被 Micrometer 采集。默认关闭是为省内存，但这两个指标是「高并发下连接被重置」
    # 故障的直接信号（实测并发 180+ 触发），对 AIOps 告警不可缺。
    mbeanregistry:
      enabled: true

spring:
  application:
    name: shortlink
  datasource:
    url: jdbc:mysql://localhost:3306/shortlink?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: shortlink
    # 不入库：本地直连时需导出 DB_PASSWORD；Docker 内由 compose 注入 SPRING_DATASOURCE_PASSWORD 覆盖
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: shortlink-stats
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch

shortlink:
  base-url: http://localhost:8082
  cache:
    ttl-hours: 24
  topic:
    clicks: shortlink.clicks
  rate-limit:
    create-limit: 5
    create-window-seconds: 60
    redirect-limit: 120
    redirect-window-seconds: 60
  metrics:
    # 消费滞后指标的刷新间隔（毫秒）。该指标会查一次 Kafka log-end offset，
    # 30s 足够且不会给 broker 造成压力。
    lag-refresh-millis: 30000

# 指标暴露：Prometheus 抓 /actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: shortlink

logging:
  level:
    com.shortlink: INFO
